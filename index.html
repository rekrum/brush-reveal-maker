<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brush Reveal Maker v1.0</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#eef1f4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1420px;margin:auto;padding:20px}h1{margin:0;font-size:25px}.sub,.hint{color:#9ba3ad}.sub{margin-top:4px}.layout{display:grid;grid-template-columns:330px minmax(520px,1fr) 310px;gap:14px;margin-top:16px}.panel{background:#171a1f;border:1px solid #2c323a;border-radius:14px;padding:14px}.drop{border:2px dashed #4c5663;border-radius:11px;padding:18px;text-align:center;cursor:pointer}.drop.drag{background:#222832;border-color:#8fa0b5}label{display:block;margin:13px 0 5px;font-size:13px;font-weight:700}.value{float:right;color:#aeb7c2;font-weight:400}input[type=range]{width:100%}select,input[type=number],input[type=color]{width:100%;background:#0f1216;color:#eee;border:1px solid #3a424d;border-radius:8px;padding:8px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:8px;padding:9px 11px;font-weight:700;cursor:pointer;background:#f1f3f5;color:#111}button.secondary{background:#303640;color:#eee}button.danger{background:#51282c;color:#ffdfe1}button:disabled{opacity:.4;cursor:not-allowed}.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.timeline{width:100%;margin-top:10px}.strokeList{display:flex;flex-direction:column;gap:7px;max-height:440px;overflow:auto}.stroke{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;padding:8px;background:#20252c;border:1px solid #333a44;border-radius:9px}.stroke.selected{outline:2px solid #d8e2ee}.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#3a424d;font-weight:800}.stroke small{color:#aab2bc}.icon{padding:6px 8px}.status{margin-top:10px;padding:9px;border-radius:8px;background:#101318;font-size:12px;color:#b8c0ca;min-height:34px}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{font-size:12px;line-height:1.55}.kbd{background:#303640;border-radius:4px;padding:1px 5px}.mode{background:#21324a!important;color:#eaf3ff!important}.advanced{display:none;border-top:1px solid #303640;margin-top:12px;padding-top:8px}.advanced.open{display:block}.point{position:absolute}.pill{font-size:11px;background:#29313b;padding:2px 6px;border-radius:10px;color:#cbd4df}.warn{color:#ffd18a}@media(max-width:1120px){.layout{grid-template-columns:300px 1fr}.right{grid-column:1/-1}.strokeList{max-height:240px}}@media(max-width:760px){.layout{grid-template-columns:1fr}.right{grid-column:auto}}
</style></head><body><div class="app"><h1>Brush Reveal Maker <small>v1.0</small></h1><div class="sub">筆跡を編集しながら、ロゴを筆書き風に露出。ブラウザ内で処理します。</div>
<div class="layout"><section class="panel">
<div id="drop" class="drop">透過PNG / WebPをドロップ<br><small>またはクリックして選択</small><input id="file" type="file" accept="image/png,image/webp" hidden></div>
<label>描画モード</label><div class="row"><button id="drawMode" class="mode">✍ 新しい画</button><button id="redraw" class="secondary">↻ 選択画を描き直す</button></div>
<label>筆表現プリセット</label><select id="preset"><option value="natural" selected>自然な筆</option><option value="uniform">均一</option><option value="sweep">払い</option><option value="power">力強い</option><option value="fine">細筆</option></select>
<label>筆の太さ <span id="brushV" class="value">70</span></label><input id="brush" type="range" min="8" max="240" value="70">
<div class="split"><div><label>スナップ <span id="snapV" class="value">18</span></label><input id="snap" type="range" min="0" max="50" value="18"></div><div><label>スムージング</label><select id="smooth"><option value="0">なし</option><option value="1">弱</option><option value="2" selected>標準</option><option value="3">強</option></select></div></div>
<div class="row"><button id="editPoints" class="secondary">● 制御点編集</button><button id="advancedBtn" class="secondary">⚙ 詳細設定</button></div>
<div id="advanced" class="advanced"><label>露出余白 <span id="revealPaddingV" class="value">+0px</span></label><input id="revealPadding" type="range" min="0" max="40" value="0" step="1"><p class="hint">通常は0でOKです。文字の端が残る場合だけ少し広げます。</p><div class="split"><div><label>入り <span id="startV" class="value">55%</span></label><input id="startTaper" type="range" min="15" max="100" value="55"></div><div><label>払い <span id="endV" class="value">25%</span></label><input id="endTaper" type="range" min="8" max="100" value="25"></div></div><label>速度変化</label><select id="motion"><option value="natural" selected>自然（入りゆっくり→加速）</option><option value="linear">一定</option><option value="ease">両端ゆっくり</option><option value="sweep">払い加速</option></select><div class="split"><div><label>かすれ</label><select id="dry"><option value="0" selected>なし</option><option value="1">弱</option><option value="2">中</option><option value="3">強</option></select></div><div><label>飛沫</label><select id="splash"><option value="0" selected>なし</option><option value="1">弱</option><option value="2">中</option><option value="3">強</option></select></div></div></div>
<label>全体の再生時間 <span id="durV" class="value">2.5秒</span></label><input id="dur" type="range" min="0.5" max="10" value="2.5" step="0.1">
<label>画と画の間隔 <span id="gapV" class="value">0.05秒</span></label><input id="gap" type="range" min="0" max="0.4" value="0.05" step="0.01">
<label>背景</label><select id="bg"><option value="transparent">透過</option><option value="#000000">黒</option><option value="#ffffff">白</option><option value="#00ff00">グリーン</option><option value="custom">任意色</option></select><input id="customBg" type="color" value="#243044" style="display:none;margin-top:6px">
<div class="row"><button id="undo" class="secondary">↶ Undo</button><button id="redo" class="secondary">↷ Redo</button><button id="clear" class="danger">全消去</button></div>
<label>プロジェクト</label><div class="row"><button id="saveJson" class="secondary">JSON保存</button><button id="loadJson" class="secondary">JSON読込</button><input id="jsonFile" type="file" accept="application/json" hidden></div>
<p class="hint">文字の中心を1画ずつドラッグしてください。スナップはカーソル付近の不透明な文字領域へ吸着します。<span class="kbd">Ctrl+Z</span> / <span class="kbd">Ctrl+Y</span> も使えます。</p>
</section>
<section class="panel"><div class="stage"><canvas id="canvas" width="1280" height="720"></canvas></div><input id="seek" class="timeline" type="range" min="0" max="1" step="0.001" value="1"><div class="row"><button id="play">▶ 再生</button><button id="loop" class="secondary">↻ ループ OFF</button><button id="one" class="secondary">選択画だけ再生</button><button id="compare" class="secondary">比較: 筆表現 ON</button></div><div id="status" class="status">画像を読み込んでください。</div></section>
<section class="panel right"><h3 style="margin-top:0">筆跡 <span id="count" class="value">0画</span></h3><div id="strokeList" class="strokeList"></div><p class="hint">画を選択して「↻」でその画だけ描き直せます。描画順・筆幅・露出余白・筆表現はそのまま引き継ぎます。</p><hr style="border-color:#303640;border-width:1px 0 0;margin:16px 0"><h3>書き出し</h3><label>形式</label><select id="format"><option value="webm">WebM</option><option value="mp4">MP4 (ブラウザ対応時)</option><option value="gif">GIF</option></select><div class="split"><div><label>FPS</label><select id="fps"><option>30</option><option selected>60</option></select></div><div><label>品質</label><select id="quality"><option value="6">高品質</option><option value="10" selected>標準</option><option value="18">軽量</option></select></div></div><button id="export" style="width:100%;margin-top:12px">書き出す</button><p id="exportNote" class="hint"></p></section></div></div>
<script>
const $=s=>document.querySelector(s), c=$('#canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
const els={file:$('#file'),drop:$('#drop'),brush:$('#brush'),brushV:$('#brushV'),revealPadding:$('#revealPadding'),revealPaddingV:$('#revealPaddingV'),preset:$('#preset'),smooth:$('#smooth'),startTaper:$('#startTaper'),endTaper:$('#endTaper'),startV:$('#startV'),endV:$('#endV'),motion:$('#motion'),dry:$('#dry'),splash:$('#splash'),snap:$('#snap'),snapV:$('#snapV'),dur:$('#dur'),durV:$('#durV'),gap:$('#gap'),gapV:$('#gapV'),bg:$('#bg'),customBg:$('#customBg'),seek:$('#seek'),list:$('#strokeList'),count:$('#count'),status:$('#status'),format:$('#format'),fps:$('#fps'),quality:$('#quality'),note:$('#exportNote')};
let img=null, imageName='', strokes=[], selected=-1,current=null, redrawIndex=-1, playing=false, loop=false, history=[],future=[]; let alpha=null, fitRect=null, pointEdit=false, dragPoint=-1, brushFx=true;
function cloneStrokes(){return strokes.map(s=>({points:s.points.map(p=>({...p})),width:s.width,revealPadding:s.revealPadding??Math.max(0,(s.revealWidth||s.width)-s.width),startTaper:s.startTaper??55,endTaper:s.endTaper??25,motion:s.motion||'natural'}))} function snapshot(){history.push(cloneStrokes());if(history.length>80)history.shift();future=[];updateUndo()}
function restore(a){strokes=a.map(s=>({...s,points:s.points.map(p=>({...p}))}));selected=Math.min(selected,strokes.length-1);renderEditor();renderList();updateUndo()}
function updateUndo(){$('#undo').disabled=!history.length;$('#redo').disabled=!future.length}
function bgColor(){return els.bg.value==='custom'?els.customBg.value:els.bg.value}
function fit(){if(!img)return null;let s=Math.min(c.width/img.width,c.height/img.height)*.88,w=img.width*s,h=img.height*s;return{x:(c.width-w)/2,y:(c.height-h)/2,w,h}}
function buildAlpha(){fitRect=fit();let t=document.createElement('canvas');t.width=c.width;t.height=c.height;let x=t.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,c.width,c.height);x.drawImage(img,fitRect.x,fitRect.y,fitRect.w,fitRect.h);alpha=x.getImageData(0,0,c.width,c.height).data}
function snapPoint(p){let r=+els.snap.value;if(!alpha||r===0)return p;let px=Math.round(p.x),py=Math.round(p.y),best=null,bd=1e9;for(let y=Math.max(0,py-r);y<=Math.min(c.height-1,py+r);y+=2)for(let x=Math.max(0,px-r);x<=Math.min(c.width-1,px+r);x+=2){let a=alpha[(y*c.width+x)*4+3];if(a>40){let d=(x-px)**2+(y-py)**2;if(d<bd){bd=d;best={x,y}}}}return best||p}
function smoothPoints(points,level){if(!level||points.length<3)return points;let a=points.map(p=>({...p}));for(let k=0;k<level;k++){let b=[a[0]];for(let i=1;i<a.length-1;i++)b.push({x:(a[i-1].x+2*a[i].x+a[i+1].x)/4,y:(a[i-1].y+2*a[i].y+a[i+1].y)/4});b.push(a.at(-1));a=b}return a}
function simplify(points,min=5){if(points.length<3)return points;let out=[points[0]],last=points[0];for(let i=1;i<points.length-1;i++){let p=points[i];if(Math.hypot(p.x-last.x,p.y-last.y)>=min){out.push(p);last=p}}out.push(points.at(-1));return out}
function clearCanvas(){ctx.clearRect(0,0,c.width,c.height);let b=bgColor();if(b!=='transparent'){ctx.fillStyle=b;ctx.fillRect(0,0,c.width,c.height)}}
function motionMap(p,mode){p=Math.max(0,Math.min(1,p));if(!brushFx||mode==='linear')return p;if(mode==='ease')return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;if(mode==='sweep')return Math.pow(p,.72);return p<.22?1.65*p*p:Math.min(1,.08+(p-.22)*1.18)}
function widthAt(s,t,mask=false){let base=mask?(s.width+(s.revealPadding||0)):s.width;if(!brushFx)return base;let a=(s.startTaper??55)/100,b=(s.endTaper??25)/100;let f=1;if(t<.18)f=a+(1-a)*(t/.18);if(t>.72)f=Math.min(f,1-(1-b)*((t-.72)/.28));return Math.max(2,base*f)}
function path(ctx2,s,partial=1,mask=false){if(s.points.length<2)return;let pts=s.points,lens=[],tot=0;for(let i=1;i<pts.length;i++){let l=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);lens.push(l);tot+=l}let target=tot*partial,used=0;ctx2.lineCap='round';ctx2.lineJoin='round';for(let i=1;i<pts.length&&used<target;i++){let l=lens[i-1],take=Math.min(l,target-used),r=take/l,a=pts[i-1],b=pts[i],e={x:a.x+(b.x-a.x)*r,y:a.y+(b.y-a.y)*r},t0=tot?used/tot:0,t1=tot?(used+take)/tot:1;ctx2.lineWidth=(widthAt(s,t0,mask)+widthAt(s,t1,mask))/2;ctx2.beginPath();ctx2.moveTo(a.x,a.y);ctx2.lineTo(e.x,e.y);ctx2.stroke();used+=take}}
function drawSplashes(mx,s,partial){let level=+els.splash.value;if(!brushFx||!level||partial<.97)return;let p=s.points.at(-1),q=s.points.at(-2)||p,ang=Math.atan2(p.y-q.y,p.x-q.x);mx.fillStyle='#fff';for(let i=0;i<level*3;i++){let d=12+i*9,off=((i%3)-1)*10,r=2+((i*7)%4);mx.beginPath();mx.arc(p.x+Math.cos(ang)*d-Math.sin(ang)*off,p.y+Math.sin(ang)*d+Math.cos(ang)*off,r,0,Math.PI*2);mx.fill()}}
function renderReveal(progress=1,only=-1){clearCanvas();if(!img)return;let f=fit();let source=document.createElement('canvas');source.width=c.width;source.height=c.height;let sx=source.getContext('2d');sx.drawImage(img,f.x,f.y,f.w,f.h);let mask=document.createElement('canvas');mask.width=c.width;mask.height=c.height;let mx=mask.getContext('2d');mx.strokeStyle='#fff';let arr=only>=0?[strokes[only]]:strokes;if(!arr.length)return;let gapFrac=Math.min(.35,(+els.gap.value*Math.max(0,arr.length-1))/(+els.dur.value));let active=1-gapFrac, each=active/arr.length,gapEach=arr.length>1?gapFrac/(arr.length-1):0;for(let i=0;i<arr.length;i++){let start=i*(each+gapEach),p=Math.max(0,Math.min(1,(progress-start)/each));p=motionMap(p,arr[i].motion||els.motion.value);if(p>0){path(mx,arr[i],p,true);drawSplashes(mx,arr[i],p)}}if(brushFx&&+els.dry.value){let lv=+els.dry.value;mx.globalCompositeOperation='destination-out';for(let k=0;k<lv*22;k++){let x=(k*83+37)%c.width,y=(k*137+53)%c.height,r=1+(k%3)*lv;mx.beginPath();mx.arc(x,y,r,0,Math.PI*2);mx.fill()}mx.globalCompositeOperation='source-over'}sx.globalCompositeOperation='destination-in';sx.drawImage(mask,0,0);ctx.drawImage(source,0,0)}
function renderEditor(){clearCanvas();if(!img){ctx.fillStyle='#747d88';ctx.font='26px system-ui';ctx.textAlign='center';ctx.fillText('画像を読み込んでください',c.width/2,c.height/2);return}let f=fit();ctx.globalAlpha=.30;ctx.drawImage(img,f.x,f.y,f.w,f.h);ctx.globalAlpha=1;strokes.forEach((s,i)=>{ctx.strokeStyle=i===selected?'#ffdf70':'#e9f2ff';ctx.globalAlpha=i===selected?1:.7;path(ctx,s);if(pointEdit&&i===selected){ctx.globalAlpha=1;s.points.forEach((p,j)=>{ctx.fillStyle=j===dragPoint?'#7ee0ff':'#ff9f6e';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill()})}ctx.globalAlpha=1;let p=s.points[0];ctx.fillStyle=i===selected?'#ffdf70':'#e9f2ff';ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,p.x,p.y)});if(current){ctx.strokeStyle='#7ee0ff';path(ctx,{points:current,width:+els.brush.value})}}
function renderList(){els.list.innerHTML='';els.count.textContent=strokes.length+'画';strokes.forEach((s,i)=>{let d=document.createElement('div');d.className='stroke'+(i===selected?' selected':'');d.innerHTML=`<div class="num">${i+1}</div><div><b>画 ${i+1}</b><br><small>筆幅 <span>${s.width}</span> / 露出余白 +${s.revealPadding||0}px</small><input data-width="${i}" type="range" min="8" max="240" value="${s.width}"></div><div><button class="secondary icon" data-redraw="${i}" title="この画を描き直す">↻</button><button class="secondary icon" data-up="${i}">↑</button><button class="secondary icon" data-down="${i}">↓</button><button class="danger icon" data-del="${i}">×</button></div>`;d.onclick=e=>{if(e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){selected=i;renderEditor();renderList()}};els.list.appendChild(d)});els.list.querySelectorAll('[data-width]').forEach(x=>x.oninput=e=>{let i=+e.target.dataset.width;strokes[i].width=+e.target.value;e.target.previousElementSibling.querySelector('span').textContent=e.target.value;renderEditor()});els.list.querySelectorAll('[data-width]').forEach(x=>x.onchange=()=>snapshot());els.list.querySelectorAll('[data-redraw]').forEach(x=>x.onclick=e=>{e.stopPropagation();beginRedraw(+x.dataset.redraw)});els.list.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{snapshot();strokes.splice(+x.dataset.del,1);selected=-1;renderEditor();renderList()});els.list.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>move(+x.dataset.up,-1));els.list.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>move(+x.dataset.down,1))}
function move(i,d){let j=i+d;if(j<0||j>=strokes.length)return;snapshot();[strokes[i],strokes[j]]=[strokes[j],strokes[i]];selected=j;renderEditor();renderList()}
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.onpointerdown=e=>{if(!img||playing)return;c.setPointerCapture(e.pointerId);let pp=pos(e);if(pointEdit&&selected>=0){let pts=strokes[selected].points,bi=-1,bd=18;pts.forEach((p,i)=>{let d=Math.hypot(p.x-pp.x,p.y-pp.y);if(d<bd){bd=d;bi=i}});if(bi>=0){snapshot();dragPoint=bi;return}}current=[snapPoint(pp)];renderEditor()};c.onpointermove=e=>{if(dragPoint>=0&&selected>=0){strokes[selected].points[dragPoint]=snapPoint(pos(e));renderEditor();return}if(current){let p=snapPoint(pos(e)),last=current.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)>3)current.push(p);renderEditor()}};function endStroke(){if(dragPoint>=0){dragPoint=-1;renderEditor();return}if(!current)return;let pts=smoothPoints(simplify(current),+els.smooth.value);current=null;if(pts.length<2){renderEditor();return}snapshot();let s={points:pts,width:+els.brush.value,revealPadding:+els.revealPadding.value,startTaper:+els.startTaper.value,endTaper:+els.endTaper.value,motion:els.motion.value};if(redrawIndex>=0&&redrawIndex<strokes.length){let old=strokes[redrawIndex];s={...old,points:pts};strokes[redrawIndex]=s;selected=redrawIndex;let n=redrawIndex+1;redrawIndex=-1;$('#drawMode').textContent='✍ 新しい画';els.status.textContent=`画 ${n} を描き直しました。設定は引き継いでいます。`; }else{strokes.push(s);selected=strokes.length-1}renderEditor();renderList()}c.onpointerup=endStroke;c.onpointercancel=endStroke;
function loadImage(f){let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{img=im;imageName=f.name;strokes=[];history=[];future=[];selected=-1;buildAlpha();renderEditor();renderList();updateUndo();els.status.textContent=`${f.name} を読み込みました。文字の中心を1画ずつなぞってください。`;URL.revokeObjectURL(u)};im.src=u}
els.drop.onclick=()=>els.file.click();els.file.onchange=e=>e.target.files[0]&&loadImage(e.target.files[0]);els.drop.ondragover=e=>{e.preventDefault();els.drop.classList.add('drag')};els.drop.ondragleave=()=>els.drop.classList.remove('drag');els.drop.ondrop=e=>{e.preventDefault();els.drop.classList.remove('drag');e.dataTransfer.files[0]&&loadImage(e.dataTransfer.files[0])};
els.brush.oninput=()=>els.brushV.textContent=els.brush.value;els.revealPadding.oninput=()=>els.revealPaddingV.textContent='+'+els.revealPadding.value+'px';els.startTaper.oninput=()=>els.startV.textContent=els.startTaper.value+'%';els.endTaper.oninput=()=>els.endV.textContent=els.endTaper.value+'%';els.snap.oninput=()=>els.snapV.textContent=els.snap.value;els.dur.oninput=()=>els.durV.textContent=els.dur.value+'秒';els.gap.oninput=()=>els.gapV.textContent=Number(els.gap.value).toFixed(2)+'秒';els.bg.onchange=()=>{els.customBg.style.display=els.bg.value==='custom'?'block':'none';renderEditor();updateExportNote()};els.customBg.oninput=renderEditor;

$('#advancedBtn').onclick=()=>$('#advanced').classList.toggle('open');
$('#editPoints').onclick=()=>{pointEdit=!pointEdit;$('#editPoints').classList.toggle('mode',pointEdit);$('#editPoints').textContent=pointEdit?'● 制御点編集中':'● 制御点編集';renderEditor()};
$('#compare').onclick=()=>{brushFx=!brushFx;$('#compare').textContent='比較: 筆表現 '+(brushFx?'ON':'OFF');renderReveal(+els.seek.value)};
els.preset.onchange=()=>{let v=els.preset.value,sets={uniform:[100,100,'linear',0,0],natural:[55,25,'natural',0,0],sweep:[65,12,'sweep',0,1],power:[80,45,'natural',1,1],fine:[70,30,'ease',0,0]},a=sets[v];els.startTaper.value=a[0];els.endTaper.value=a[1];els.motion.value=a[2];els.dry.value=a[3];els.splash.value=a[4];els.startTaper.oninput();els.endTaper.oninput();if(selected>=0){snapshot();Object.assign(strokes[selected],{startTaper:a[0],endTaper:a[1],motion:a[2]});renderEditor();renderList()}};
$('#undo').onclick=()=>{if(!history.length)return;future.push(cloneStrokes());restore(history.pop())};$('#redo').onclick=()=>{if(!future.length)return;history.push(cloneStrokes());restore(future.pop())};$('#clear').onclick=()=>{if(!strokes.length)return;snapshot();strokes=[];selected=-1;renderEditor();renderList()};function beginRedraw(i){if(i<0||i>=strokes.length)return;selected=i;redrawIndex=i;renderEditor();renderList();$('#drawMode').textContent=`✍ 画 ${i+1} を描き直し中`;els.status.textContent=`画 ${i+1} を描き直します。キャンバス上をドラッグしてください。元の筆幅・露出余白・筆表現は保持されます。`; }$('#redraw').onclick=()=>{if(selected<0)return alert('描き直す画を選択してください');beginRedraw(selected)};$('#drawMode').onclick=()=>{redrawIndex=-1;$('#drawMode').textContent='✍ 新しい画';els.status.textContent='新しい画を追加するモードです。'};
async function play(only=-1){if(!img||!strokes.length)return;playing=true;let ms=+els.dur.value*1000,start=performance.now();return new Promise(res=>{function tick(t){let p=Math.min(1,(t-start)/ms);let eased=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;els.seek.value=eased;renderReveal(eased,only);if(p<1)requestAnimationFrame(tick);else{playing=false;res();if(loop&&only<0)setTimeout(()=>play(),120)}}requestAnimationFrame(tick)})}$('#play').onclick=()=>play();$('#one').onclick=()=>selected>=0?play(selected):alert('筆跡を1つ選択してください');$('#loop').onclick=()=>{loop=!loop;$('#loop').textContent='↻ ループ '+(loop?'ON':'OFF')};els.seek.oninput=()=>renderReveal(+els.seek.value);
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#saveJson').onclick=()=>{let data={app:'Brush Reveal Maker',version:'1.0',imageName,canvas:{width:c.width,height:c.height},settings:{duration:+els.dur.value,gap:+els.gap.value,background:els.bg.value,customBg:els.customBg.value,preset:els.preset.value,smoothing:+els.smooth.value,dry:+els.dry.value,splash:+els.splash.value},strokes};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'brush-reveal-project.json')};$('#loadJson').onclick=()=>$('#jsonFile').click();$('#jsonFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());snapshot();strokes=(d.strokes||[]).map(s=>({...s,revealPadding:s.revealPadding??Math.max(0,(s.revealWidth||s.width)-s.width)}));if(d.settings){els.dur.value=d.settings.duration||2.5;els.gap.value=d.settings.gap||.05;els.bg.value=d.settings.background||'transparent';els.customBg.value=d.settings.customBg||'#243044';els.dur.oninput();els.gap.oninput();els.bg.onchange()}selected=-1;renderEditor();renderList();els.status.textContent='筆跡設定を読み込みました。画像は別途読み込んでください。'}catch(err){alert('JSONを読み込めませんでした')}};
function mp4Mime(){return ['video/mp4;codecs=avc1.42E01E','video/mp4'].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||null}function webmMime(){return ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||null}
function updateExportNote(){let f=els.format.value;if(f==='mp4'){els.note.innerHTML=mp4Mime()?'このChromeではMP4直接出力に対応しています。':'<span class="warn">このChromeではMP4直接出力が利用できません。WebMをご利用ください。</span>';if(bgColor()==='transparent')els.note.innerHTML+=' MP4では透過背景は保持されません。'}else if(f==='gif')els.note.textContent='GIFは256色です。高解像度・60fpsでは書き出しに時間がかかります。';else els.note.textContent='透過背景を使う場合はWebM推奨です。'}els.format.onchange=updateExportNote;
async function exportMedia(type){if(!img||!strokes.length)return alert('画像と筆跡を用意してください');if(type==='gif')return exportGif();let mime=type==='mp4'?mp4Mime():webmMime();if(!mime)return alert(type.toUpperCase()+'の直接出力にこのブラウザが対応していません。');let stream=c.captureStream(+els.fps.value),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16000000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);let done=new Promise(r=>rec.onstop=()=>{download(new Blob(chunks,{type:mime}),'brush-reveal.'+type);r()});rec.start();renderReveal(0);await new Promise(r=>setTimeout(r,120));await play();await new Promise(r=>setTimeout(r,160));rec.stop();await done;renderEditor()}
async function exportGif(){els.status.textContent='GIFエンコーダーを読み込み中…';let mod;try{mod=await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm')}catch(e){alert('GIFエンコーダーを読み込めませんでした。インターネット接続を確認してください。');return}let {GIFEncoder,quantize,applyPalette}=mod,enc=GIFEncoder(),fps=Math.min(30,+els.fps.value),frames=Math.max(2,Math.round(+els.dur.value*fps)),delay=Math.round(1000/fps);for(let i=0;i<frames;i++){let p=i/(frames-1);renderReveal(p);let data=ctx.getImageData(0,0,c.width,c.height),pal=quantize(data.data,256,{format:'rgba4444',oneBitAlpha:bgColor()==='transparent'}),idx=applyPalette(data.data,pal,'rgba4444');enc.writeFrame(idx,c.width,c.height,{palette:pal,delay,transparent:bgColor()==='transparent'});els.status.textContent=`GIF書き出し ${i+1}/${frames}`;if(i%4===0)await new Promise(r=>setTimeout(r,0))}enc.finish();download(new Blob([enc.bytesView()],{type:'image/gif'}),'brush-reveal.gif');els.status.textContent='GIFを書き出しました。';renderEditor()}
$('#export').onclick=()=>exportMedia(els.format.value);window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('#redo').click():$('#undo').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('#redo').click()}});renderEditor();renderList();updateUndo();updateExportNote();
</script></body></html>
